name: Build SheetBot Android Agent APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-agent/**'
      - '.github/workflows/build-agent-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Ensure Permanent Keystore Exists
        run: |
          mkdir -p android-agent/keystore
          if [ ! -f android-agent/keystore/sheetbot-agent.jks ]; then
            echo "Generating permanent keystore..."
            keytool -genkeypair -v \
              -keystore android-agent/keystore/sheetbot-agent.jks \
              -alias sheetbot_agent \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype JKS \
              -storepass sheetbot_agent_key_2026 \
              -keypass sheetbot_agent_key_2026 \
              -dname "CN=SheetBot Agent, OU=SheetBot, O=SheetBot Cloud, L=Seoul, ST=Seoul, C=KR"
          fi

      - name: Build Release APK
        run: |
          cd android-agent
          gradle assembleRelease --stacktrace

      - name: Copy APK to artifacts and public
        run: |
          mkdir -p release-apk
          find android-agent/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release-apk/sheetbot-deposit-agent.apk \;
          mkdir -p public/downloads
          cp release-apk/sheetbot-deposit-agent.apk public/downloads/sheetbot-deposit-agent.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheetbot-deposit-agent-apk
          path: release-apk/*.apk
          retention-days: 30

      - name: Commit and Push Keystore and APK back to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add android-agent/keystore/sheetbot-agent.jks public/downloads/sheetbot-deposit-agent.apk
          if ! git diff --staged --quiet; then
            git commit -m "build(agent): bundle release apk v1.5.0"
            git push origin main
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.5.0
          name: "SheetBot Agent M v1.5.0 (Phase 4)"
          body: "시트봇 에이전트 M (SheetBot Agent M) v1.5.0 (Phase 4)\n• 서버 다운 실시간 감지 & 거짓 정상(False Positive) 완전 차단\n• 스마트폰 잠금/화면 꺼짐 상태에서도 화면 강제 점등(WakeLock) & 전면 비상 경보 팝업\n• 2분 서버 통신 두절 시 TTS 음성 비상 경보 발동\n• 서버 다운 중 수신된 입금 SMS/푸시 오프라인 안전 대기열(Local Queue) 무손실 보관 및 복구 시 자동 일괄 전송(Drain)\n• 가상 입금 테스트 버튼 영구 삭제 및 실시간 서버 통신 관제 콕핏 탑재"
          files: release-apk/sheetbot-deposit-agent.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
