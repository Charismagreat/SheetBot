name: Build SheetBot Android Agent APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-agent/**'
      - '.github/workflows/build-agent-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build Debug APK
        run: |
          cd android-agent
          gradle assembleDebug --stacktrace

      - name: Copy APK to artifacts
        run: |
          mkdir -p release-apk
          find android-agent/app/build/outputs/apk/ -name "*.apk" -exec cp {} release-apk/sheetbot-deposit-agent.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheetbot-deposit-agent-apk
          path: release-apk/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "SheetBot Deposit Agent v1.0.0"
          body: "SheetBot 무통장 입금 실시간 감지 및 자동 충전 네이티브 Android 앱"
          files: release-apk/sheetbot-deposit-agent.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
