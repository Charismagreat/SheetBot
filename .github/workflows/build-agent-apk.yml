name: Build SheetBot Android Agent APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-agent/**'
      - '.github/workflows/build-agent-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Ensure Permanent Keystore Exists
        run: |
          mkdir -p android-agent/keystore
          if [ ! -f android-agent/keystore/sheetbot-agent.jks ]; then
            echo "Generating permanent keystore..."
            keytool -genkeypair -v \
              -keystore android-agent/keystore/sheetbot-agent.jks \
              -alias sheetbot_agent \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype JKS \
              -storepass sheetbot_agent_key_2026 \
              -keypass sheetbot_agent_key_2026 \
              -dname "CN=SheetBot Agent, OU=SheetBot, O=SheetBot Cloud, L=Seoul, ST=Seoul, C=KR"
          fi

      - name: Build Release APK
        run: |
          cd android-agent
          gradle assembleRelease --stacktrace

      - name: Copy APK to artifacts and public
        run: |
          mkdir -p release-apk
          find android-agent/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release-apk/sheetbot-deposit-agent.apk \;
          mkdir -p public/downloads
          cp release-apk/sheetbot-deposit-agent.apk public/downloads/sheetbot-deposit-agent.apk
          cp release-apk/sheetbot-deposit-agent.apk public/downloads/SheetBotAgent2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheetbot-deposit-agent-apk
          path: release-apk/*.apk
          retention-days: 30

      - name: Commit and Push Keystore and APK back to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add android-agent/keystore/sheetbot-agent.jks public/downloads/sheetbot-deposit-agent.apk public/downloads/SheetBotAgent2.apk
          if ! git diff --staged --quiet; then
            git commit -m "build(agent): bundle release apk v1.6.0"
            git push origin main
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.6.0
          name: "SheetBot Universal Agent v1.6.0"
          body: "시트봇 유니버설 에이전트 v1.6.0 (단일 통합 APK 배포)\n• 단일 APK로 일반 이용자용(SheetBot Agent)과 관리자용(SheetBot Agent M) 동시 지원\n• 이용자 모드: 고객 수신 SMS 시트봇 서버 및 구글 시트 실시간 동기화\n• 구글 시트 연동 및 0원 문자 발송 완벽 지원\n• QR 스캔 시 모드 자동 인식 및 인앱 원클릭 업데이트 지원"
          files: release-apk/sheetbot-deposit-agent.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
