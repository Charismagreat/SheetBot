name: Build SheetBot Android Agent APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-agent/**'
      - '.github/workflows/build-agent-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: |
          cd android-agent
          chmod +x gradlew || true

      - name: Build Debug & Release APK
        run: |
          cd android-agent
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace
          else
            gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheetbot-deposit-agent-apk
          path: android-agent/app/build/outputs/apk/**/*.apk
          retention-days: 30
