name: Build SheetBot Android Agent APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-agent/**'
      - '.github/workflows/build-agent-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Ensure Permanent Keystore Exists
        run: |
          mkdir -p android-agent/keystore
          if [ ! -f android-agent/keystore/sheetbot-agent.jks ]; then
            echo "Generating permanent keystore..."
            keytool -genkeypair -v \
              -keystore android-agent/keystore/sheetbot-agent.jks \
              -alias sheetbot_agent \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype JKS \
              -storepass sheetbot_agent_key_2026 \
              -keypass sheetbot_agent_key_2026 \
              -dname "CN=SheetBot Agent, OU=SheetBot, O=SheetBot Cloud, L=Seoul, ST=Seoul, C=KR"
          fi

      - name: Build Release APK
        run: |
          cd android-agent
          gradle assembleRelease --stacktrace

      - name: Copy APK to artifacts and public
        run: |
          mkdir -p release-apk
          find android-agent/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release-apk/sheetbot-deposit-agent.apk \;
          mkdir -p public/downloads
          cp release-apk/sheetbot-deposit-agent.apk public/downloads/sheetbot-deposit-agent.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheetbot-deposit-agent-apk
          path: release-apk/*.apk
          retention-days: 30

      - name: Commit and Push Keystore and APK back to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add android-agent/keystore/sheetbot-agent.jks public/downloads/sheetbot-deposit-agent.apk
          if ! git diff --staged --quiet; then
            git commit -m "build(agent): bundle release apk v1.4.0"
            git push origin main
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.4.0
          name: "SheetBot Agent M v1.4.0 (Phase 3)"
          body: "시트봇 에이전트 M (SheetBot Agent M) v1.4.0 (Phase 3)\n• 무인 24/7 공기계 생명선 & 장애 관제 시스템 구축\n• 전원 충전기 분리/연결 감지 & 배터리 방전 비상 경보\n• 대시보드 실시간 배터리 잔량(%) 및 충전 상태(⚡) 시각화\n• 3회 연속 실패 시 와치독 비상 알림 & 자동 복구\n• OLED 번인 & 발열 방지 AOD 블랙 스크린 모드 (더블 탭 복귀)\n• 인앱 원클릭 무삭제 덮어쓰기 업데이트 지원"
          files: release-apk/sheetbot-deposit-agent.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
