name: Build SheetBot User Agent APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-user-agent/**'
      - '.github/workflows/build-user-agent-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Ensure Permanent Keystore Exists
        run: |
          mkdir -p android-user-agent/keystore
          if [ -f android-agent/keystore/sheetbot-agent.jks ]; then
            cp android-agent/keystore/sheetbot-agent.jks android-user-agent/keystore/sheetbot-agent.jks
          elif [ ! -f android-user-agent/keystore/sheetbot-agent.jks ]; then
            echo "Generating permanent keystore..."
            keytool -genkeypair -v \
              -keystore android-user-agent/keystore/sheetbot-agent.jks \
              -alias sheetbot_agent \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype JKS \
              -storepass sheetbot_agent_key_2026 \
              -keypass sheetbot_agent_key_2026 \
              -dname "CN=SheetBot User Agent, OU=SheetBot, O=SheetBot Cloud, L=Seoul, ST=Seoul, C=KR"
          fi

      - name: Build Release APK
        run: |
          cd android-user-agent
          gradle assembleRelease --stacktrace

      - name: Copy APK to artifacts and public
        run: |
          mkdir -p release-apk
          find android-user-agent/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release-apk/SheetBotAgent.apk \;
          mkdir -p public/downloads
          cp release-apk/SheetBotAgent.apk public/downloads/SheetBotAgent.apk
          cp release-apk/SheetBotAgent.apk public/downloads/SheetBotAgent2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheetbot-user-agent-apk
          path: release-apk/*.apk
          retention-days: 30

      - name: Commit and Push Keystore and APK back to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add android-user-agent/keystore/sheetbot-agent.jks public/downloads/SheetBotAgent.apk public/downloads/SheetBotAgent2.apk
          if ! git diff --staged --quiet; then
            git commit -m "build(user-agent): bundle release apk v2.0.2"
            git push origin main
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: user-v2.0.2
          name: "SheetBot Mobile Agent (이용자용) v2.0.2"
          body: "시트봇 모바일 에이전트 v2.0.2 정식 릴리스\n• 🛡️ Zero-Retention 프라이버시 안심 보증 카드 탑재 (서버 무보관 100% · 내 구글 드라이브 직통)\n• 📱 시트봇 모바일 에이전트 브랜딩 일원화 (구글 시트 ↔ 스마트폰 양방향 자동화)\n• 🏪 포스(POS) 및 배달앱(배민/쿠팡이츠) 결제 알림 실시간 구글 시트 매출 장부 기입\n• ⚡ 통신비 0원 무제한 고객 알림 문자 발송 및 실시간 수신 동기화 안정성 개선"
          files: release-apk/SheetBotAgent.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
