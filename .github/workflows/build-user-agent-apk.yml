name: Build SheetBot User Agent APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-user-agent/**'
      - '.github/workflows/build-user-agent-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Ensure Permanent Keystore Exists
        run: |
          mkdir -p android-user-agent/keystore
          if [ -f android-agent/keystore/sheetbot-agent.jks ]; then
            cp android-agent/keystore/sheetbot-agent.jks android-user-agent/keystore/sheetbot-agent.jks
          elif [ ! -f android-user-agent/keystore/sheetbot-agent.jks ]; then
            echo "Generating permanent keystore..."
            keytool -genkeypair -v \
              -keystore android-user-agent/keystore/sheetbot-agent.jks \
              -alias sheetbot_agent \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype JKS \
              -storepass sheetbot_agent_key_2026 \
              -keypass sheetbot_agent_key_2026 \
              -dname "CN=SheetBot User Agent, OU=SheetBot, O=SheetBot Cloud, L=Seoul, ST=Seoul, C=KR"
          fi

      - name: Build Release APK
        run: |
          cd android-user-agent
          gradle assembleRelease --stacktrace

      - name: Copy APK to artifacts
        run: |
          mkdir -p release-apk
          find android-user-agent/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release-apk/SheetBotAgent.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheetbot-user-agent-apk
          path: release-apk/*.apk
          retention-days: 30

      - name: Commit and Push Keystore and APK back to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p public/downloads
          cp release-apk/SheetBotAgent.apk public/downloads/SheetBotAgent.apk
          git add android-user-agent/keystore/sheetbot-agent.jks public/downloads/SheetBotAgent.apk
          if ! git diff --staged --quiet; then
            git commit -m "build(user-agent): update keystore and public SheetBotAgent.apk"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Extract Version from Gradle
        id: get_version
        run: |
          VERSION_NAME=$(grep 'versionName =' android-user-agent/app/build.gradle.kts | head -n1 | cut -d'"' -f2)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: user-v${{ steps.get_version.outputs.VERSION_NAME }}
          body: "시트봇 모바일 에이전트 v${{ steps.get_version.outputs.VERSION_NAME }} 릴리즈\n• 🧾 [영수증 대장 0초 즉시 열기 해결] 영수증/명함 대장 사전 캐싱 및 0초 프리셋 탑재로 지연 없이 즉시 열리도록 개선\n• ⚡ [프로비저닝 Fast-Path 0ms 최적화] 기존 시트 탐색 시 무거운 드라이브 재검색을 생략하고 0초 즉시 반환\n• 📊 [모바일 웹앱 13개 전체 열 완벽 지원] 영수증(13열) 및 명함(11열) 전체 데이터 표시 및 모바일 최적화 웹앱 연동"
          files: release-apk/SheetBotAgent.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
