name: Build SheetBot User Agent APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-user-agent/**'
      - '.github/workflows/build-user-agent-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Ensure Permanent Keystore Exists
        run: |
          mkdir -p android-user-agent/keystore
          if [ -f android-agent/keystore/sheetbot-agent.jks ]; then
            cp android-agent/keystore/sheetbot-agent.jks android-user-agent/keystore/sheetbot-agent.jks
          elif [ ! -f android-user-agent/keystore/sheetbot-agent.jks ]; then
            echo "Generating permanent keystore..."
            keytool -genkeypair -v \
              -keystore android-user-agent/keystore/sheetbot-agent.jks \
              -alias sheetbot_agent \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype JKS \
              -storepass sheetbot_agent_key_2026 \
              -keypass sheetbot_agent_key_2026 \
              -dname "CN=SheetBot User Agent, OU=SheetBot, O=SheetBot Cloud, L=Seoul, ST=Seoul, C=KR"
          fi

      - name: Build Release APK
        run: |
          cd android-user-agent
          gradle assembleRelease --stacktrace

      - name: Copy APK to artifacts and public
        run: |
          mkdir -p release-apk
          find android-user-agent/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release-apk/SheetBotAgent.apk \;
          mkdir -p public/downloads
          cp release-apk/SheetBotAgent.apk public/downloads/SheetBotAgent.apk
          cp release-apk/SheetBotAgent.apk public/downloads/SheetBotAgent2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheetbot-user-agent-apk
          path: release-apk/*.apk
          retention-days: 30

      - name: Commit and Push Keystore and APK back to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add android-user-agent/keystore/sheetbot-agent.jks public/downloads/SheetBotAgent.apk public/downloads/SheetBotAgent2.apk
          if ! git diff --staged --quiet; then
            git commit -m "build(user-agent): bundle release apk v1.7.0"
            git push origin main
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: user-v1.7.0
          name: "SheetBot Agent (이용자용) v1.7.0"
          body: "시트봇 에이전트 (SheetBot Agent 이용자용) v1.7.0 정식 업데이트\n• 🎙️ 자연어 음성/텍스트 모바일 AI 시트 코파일럿 (Google Apps Script 함수 원격 다이렉트 구동)\n• 💬 말 한마디로 고객 문자 자동 발송 / 정산 마감 / 시트 데이터 조회 및 TTS 음성 브리핑\n• 🔴 유튜브 영상 및 웹 브라우저 [공유하기] 시 구글 시트 자동 스크랩 & Gemini AI 핵심 3줄 요약\n• 📊 [SheetBot] 웹 링크 & 유튜브 스크랩 대장 구글 스프레드시트 실시간 자동 기록\n• 🧾 영수증 사진 AI OCR 실시간 분석 & [SheetBot] 스마트 경비 영수증 대장 자동 장부화\n• 🪪 명함 사진 AI OCR 실시간 분석 & [SheetBot] 스마트 명함 관리 대장 자동 인맥화\n• 📊 고객 360도 올인원 비즈니스 통합 CRM 대장 자동 프로비저닝 지원\n• 🎙️ 통화 녹음 AI STT & 3줄 핵심 요약 & Action Items 자동 추출\n• 📞 부재중 전화(Missed Call) 감지 시 0원 스마트 안내 문자 자동 회신 및 대장 기록\n• 💼 통화 종료 직후 모바일 명함 원터치 발송 지원\n• 💬 문자(SMS/LMS) 송수신 및 카카오톡 대화 구글 시트 실시간 자동 기록"
          files: release-apk/SheetBotAgent.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
