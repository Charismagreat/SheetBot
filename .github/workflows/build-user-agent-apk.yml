name: Build SheetBot User Agent APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-user-agent/**'
      - '.github/workflows/build-user-agent-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Ensure Permanent Keystore Exists
        run: |
          mkdir -p android-user-agent/keystore
          if [ -f android-agent/keystore/sheetbot-agent.jks ]; then
            cp android-agent/keystore/sheetbot-agent.jks android-user-agent/keystore/sheetbot-agent.jks
          elif [ ! -f android-user-agent/keystore/sheetbot-agent.jks ]; then
            echo "Generating permanent keystore..."
            keytool -genkeypair -v \
              -keystore android-user-agent/keystore/sheetbot-agent.jks \
              -alias sheetbot_agent \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype JKS \
              -storepass sheetbot_agent_key_2026 \
              -keypass sheetbot_agent_key_2026 \
              -dname "CN=SheetBot User Agent, OU=SheetBot, O=SheetBot Cloud, L=Seoul, ST=Seoul, C=KR"
          fi

      - name: Build Release APK
        run: |
          cd android-user-agent
          gradle assembleRelease --stacktrace

      - name: Copy APK to artifacts
        run: |
          mkdir -p release-apk
          find android-user-agent/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release-apk/SheetBotAgent.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheetbot-user-agent-apk
          path: release-apk/*.apk
          retention-days: 30

      - name: Commit and Push Keystore back to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add android-user-agent/keystore/sheetbot-agent.jks
          if ! git diff --staged --quiet; then
            git commit -m "build(user-agent): update keystore"
            git push origin main
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: user-v2.1.14
          name: "SheetBot Mobile Agent (이용자용) v2.1.14"
          body: "시트봇 모바일 에이전트 v2.1.14 긴급 안정화 패치\n• 🛡️ [글로벌 크래시 방어벽 구축] SheetBotApp Application 클래스 신설 및 전역 UncaughtExceptionHandler 탑재로 앱 비정상 종료 완벽 차단\n• ⚡ [코루틴 스코프 안전성 강화] SupervisorJob 및 CoroutineExceptionHandler 적용으로 비동기 통신 오류 시 프로세스 크래시 원천 방지\n• 🔄 [라이프사이클 전방위 보호] onResume, onDestroy 및 백그라운드 구글 시트 URL 사전 캐싱 전면 안전 가드 적용\n• 📑 [AI 스마트 견적 & 단가표 대장 연동 스위치 완벽 보호] 메인 화면에서 안전하게 구글 시트 단가표 및 견적발급대장 연동"
          files: release-apk/SheetBotAgent.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
