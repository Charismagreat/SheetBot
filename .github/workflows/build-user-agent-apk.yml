name: Build SheetBot User Agent APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-user-agent/**'
      - '.github/workflows/build-user-agent-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Ensure Permanent Keystore Exists
        run: |
          mkdir -p android-user-agent/keystore
          if [ -f android-agent/keystore/sheetbot-agent.jks ]; then
            cp android-agent/keystore/sheetbot-agent.jks android-user-agent/keystore/sheetbot-agent.jks
          elif [ ! -f android-user-agent/keystore/sheetbot-agent.jks ]; then
            echo "Generating permanent keystore..."
            keytool -genkeypair -v \
              -keystore android-user-agent/keystore/sheetbot-agent.jks \
              -alias sheetbot_agent \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype JKS \
              -storepass sheetbot_agent_key_2026 \
              -keypass sheetbot_agent_key_2026 \
              -dname "CN=SheetBot User Agent, OU=SheetBot, O=SheetBot Cloud, L=Seoul, ST=Seoul, C=KR"
          fi

      - name: Build Release APK
        run: |
          cd android-user-agent
          gradle assembleRelease --stacktrace

      - name: Copy APK to artifacts and public
        run: |
          mkdir -p release-apk
          find android-user-agent/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release-apk/SheetBotAgent.apk \;
          mkdir -p public/downloads
          cp release-apk/SheetBotAgent.apk public/downloads/SheetBotAgent.apk
          cp release-apk/SheetBotAgent.apk public/downloads/SheetBotAgent2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheetbot-user-agent-apk
          path: release-apk/*.apk
          retention-days: 30

      - name: Commit and Push Keystore and APK back to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add android-user-agent/keystore/sheetbot-agent.jks public/downloads/SheetBotAgent.apk public/downloads/SheetBotAgent2.apk
          if ! git diff --staged --quiet; then
            git commit -m "build(user-agent): bundle release apk v1.9.0"
            git push origin main
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: user-v1.9.0
          name: "SheetBot Agent (이용자용) v1.9.0"
          body: "시트봇 에이전트 (SheetBot Agent 이용자용) v1.9.0 정식 업데이트\n• 💰 실시간 내 토큰 지갑 잔액 & 회원 등급(PRO/FREE) 카드 상시 표시\n• ⚡ 토스(Toss) 앱 원터치 1초 송금 연동 (금액/받는사람 자동 입력, 수수료 0원 혜택)\n• 💳 인앱 간편 무통장 충전 (스타터 5만 / 스탠다드 15만 / 프로 45만 패키지)\n• 🤖 입금 즉시 3초 만에 토큰 자동 충전 및 실시간 잔액 동기화\n• 🔐 Google 원클릭 로그인(Sign in with Google) 지원 (PC 없이 스마트폰 단독 0초 자동 연동)\n• 🎙️ 자연어 음성/텍스트 모바일 AI 시트 코파일럿 (Google Apps Script 함수 원격 다이렉트 구동)\n• 💬 말 한마디로 고객 문자 자동 발송 / 정산 마감 / 시트 데이터 조회 및 TTS 음성 브리핑\n• 🔴 유튜브 영상 및 웹 브라우저 [공유하기] 시 구글 시트 자동 스크랩 & Gemini AI 핵심 3줄 요약\n• 🧾 영수증 & 🪪 명함 사진 AI OCR 실시간 분석 및 대장 자동 기록\n• 📞 부재중 전화 감지 시 0원 스마트 안내 문자 자동 회신"
          files: release-apk/SheetBotAgent.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
