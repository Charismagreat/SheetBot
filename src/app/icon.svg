<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- 에메랄드 to 인디고 시그니처 그라데이션 -->
    <linearGradient id="sbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- 시트 셀 그라데이션 -->
    <linearGradient id="sbCell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15" />
    </linearGradient>

    <!-- 우상단 AI 셀 -->
    <linearGradient id="sbActiveCell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.35" />
    </linearGradient>

    <!-- AI 스파크 빛 -->
    <linearGradient id="sbSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
  </defs>

  <!-- 둥근 스퀘어 배경 (Squircle) -->
  <rect width="100" height="100" rx="26" fill="url(#sbBg)" />

  <!-- 1. 좌상단 시트 데이터 셀 -->
  <rect x="20" y="20" width="26" height="26" rx="6" fill="url(#sbCell)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" />
  <line x1="25" y1="29" x2="41" y2="29" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="25" y1="36" x2="35" y2="36" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round" />

  <!-- 2. 좌하단 시트 데이터 셀 -->
  <rect x="20" y="54" width="26" height="26" rx="6" fill="url(#sbCell)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" />
  <line x1="25" y1="63" x2="39" y2="63" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="25" y1="70" x2="33" y2="70" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round" />

  <!-- 3. 우하단 시트 데이터 셀 -->
  <rect x="54" y="54" width="26" height="26" rx="6" fill="url(#sbCell)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" />
  <line x1="59" y1="63" x2="73" y2="63" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="59" y1="70" x2="68" y2="70" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round" />

  <!-- 4. 우상단 셀: AI 활성 셀 (스파크) -->
  <rect x="54" y="20" width="26" height="26" rx="6" fill="url(#sbActiveCell)" stroke="#a7f3d0" stroke-opacity="0.9" stroke-width="2.5" />

  <!-- 4포인트 다이아몬드 AI 스파크 -->
  <path d="M67 24 C67 29 63 33 57 33 C63 33 67 37 67 42 C67 37 71 33 77 33 C71 33 67 29 67 24 Z" fill="url(#sbSpark)" />
  <circle cx="67" cy="33" r="2.2" fill="#ffffff" />

  <!-- 미니 보조 스파크 -->
  <path d="M48 48 C48 50 46 51 44 51 C46 51 48 52 48 54 C48 52 50 51 52 51 C50 51 48 50 48 48 Z" fill="#fef08a" opacity="0.95" />
</svg>
